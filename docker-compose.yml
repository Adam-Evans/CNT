version: '3.8'

services:
  cnt-app:
    build:
      context: https://github.com/Adam-Evans/CNT.git
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/cnt.db
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GIN_MODE=release
    volumes:
      - cnt-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  cnt-data:
    driver: local
